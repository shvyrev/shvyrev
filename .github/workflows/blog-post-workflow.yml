name: Latest blog posts

on:
  schedule:
    - cron: '23 6 * * *' # раз в день, утро по UTC
  workflow_dispatch: # и по кнопке в интерфейсе Actions

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest Habr articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Habr RSS feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: 'https://habr.com/ru/rss/users/sergey-shvyrev/publications/articles/'
          max_post_count: 5
          commit_message: 'docs: обновлена лента статей с Хабра'
